services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      # Published on 127.0.0.1 only: the browser on this machine reaches it,
      # other machines on the network do not.
      - "127.0.0.1:8000:8000"
    networks:
      - application
    depends_on:
      - database
    environment:
      MONGODB_CONNECTION_STRING: "mongodb://database:27017"
      MONGODB_DATABASE: undergrad_advisor
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGEME-by-overriding-in-dot-env-file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-?}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      BRAINFORGE_USERNAME: ${BRAINFORGE_USERNAME:-}
      BRAINFORGE_PASSWORD: ${BRAINFORGE_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GEMINI_MODEL: gemini-2.5-flash
      # School pack to run: a folder in schools/ (cu-boulder, uw-madison, uva).
      # For a legacy single-file config (e.g. /ccai/phd_config.yaml), set
      # CONFIG_PATH in your .env and SCHOOL= (empty); setting both is an error.
      SCHOOL: ${SCHOOL-cu-boulder}
      CONFIG_PATH: ${CONFIG_PATH:-}
      # Local-only auth bypass for the homepage "Developer mode" button. Off by
      # default; opt in with ENABLE_DEV_LOGIN=true and REACT_APP_ENABLE_DEV_LOGIN=true
      # in your .env. Never enable it in a real deployment.
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-false}
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "3000:3000"
    networks:
      - application
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      REACT_APP_TESTING_ONBOARDING: ${REACT_APP_TESTING_ONBOARDING:-false}
      REACT_APP_ENABLE_DEV_LOGIN: ${REACT_APP_ENABLE_DEV_LOGIN:-false}
  database:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    networks:
      - application
volumes:
  mongo_data:
networks:
  application:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
