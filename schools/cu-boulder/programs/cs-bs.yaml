notes:
  - "Computer Science electives: 10-12 credits of approved coursework to bring total Computer Science credits to at least 58 (approved list on the department website)."
  - "Natural science electives: 8-9 credits to bring natural science to 17 credits (approved list on the department website)."
  - "Humanities, social sciences and writing: 18 credits under the College of Engineering and Applied Science requirements."
  - "Free electives: about 13 credits to bring the total to at least 128; the catalog gives the degree as 128-134 credits."
  - The catalog requirements section states no minimum grade for the degree courses.
  - A student may not earn both a B.S. and a B.A. in computer science, or a computer science bachelor's and a computer science minor, from CU Boulder.
