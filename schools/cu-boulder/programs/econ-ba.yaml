notes:
  - At least 33 ECON credits, at least 24 of them upper-division (27 for students who transfer two 3-credit principles courses).
  - Required major courses and the math course need C- or better and cannot be taken pass/fail.
  - No more than 45 ECON credits count toward graduation.
  - Major GPA of at least 2.000 to graduate.
  - Transfer students must complete at least 12 upper-division ECON credits at CU Boulder.
  - "A&S degree requirements (not encoded; from https://catalog.colorado.edu/undergraduate/colleges-schools/arts-sciences/policies-requirements/): 120 credits, 45 upper-division, 45 at CU Boulder with 30 upper-division A&S, 2.00 GPA overall and in the major, and Gen Ed (World Language, Quantitative Reasoning, Written Communication, 12 credits each of Arts & Humanities, Natural Sciences with a lab and Social Sciences, U.S. and Global Perspective)."
