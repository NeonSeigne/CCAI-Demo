notes:
  - "General technical electives: 6 credits from the department's General Technical Electives list."
  - "Humanities, social sciences and writing: one Writing course (3 credits) and 15 HSS credits, at least 6 of them upper-division, under the college requirements."
  - "Free electives: at least 6 credits to reach the 128-credit minimum."
  - A required course that is a prerequisite or corequisite for another required course needs C- or better; other required courses need D- or better.
  - A class can count toward only one requirement in the major.
  - A professional exam (usually the FE exam; GRE, MCAT, LSAT or GMAT also approved) and the college Senior Survey are required to graduate.
