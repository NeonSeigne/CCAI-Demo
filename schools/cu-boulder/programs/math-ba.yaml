notes:
  - Core plus track is 36-40 credits.
  - C- or better in each core and track course, and at least a C average in all mathematics work attempted.
  - "Applicable track: MATH 4510, MATH 3430, MATH 4520 or 4470, and two upper-division MATH or approved APPM electives."
  - "Secondary Education track: MATH 3110 or 3140, MATH 3120, 3210, 3510 and 4820. It does not give a teaching license."
  - "Computational track: CSCI 1300 and CSCI 2270 (ancillary, outside major hours and GPA), CSCI 3104, MATH 3430, MATH/APPM 4650, and two MATH, approved APPM or approved CSCI electives, at least one at the 4000 level."
  - "Statistics track: MATH 4510, 4520, 4540, and two of APPM 4560, APPM 4590, MATH 6550, STAT 4000, STAT 4010, STAT 4610."
  - "A&S degree requirements (not encoded; from https://catalog.colorado.edu/undergraduate/colleges-schools/arts-sciences/policies-requirements/): 120 credits, 45 upper-division, 45 at CU Boulder with 30 upper-division A&S, 2.00 GPA overall and in the major, and Gen Ed (World Language, Quantitative Reasoning, Written Communication, 12 credits each of Arts & Humanities, Natural Sciences with a lab and Social Sciences, U.S. and Global Perspective)."
