# Drafted from https://catalog.colorado.edu/undergraduate/colleges-schools/arts-sciences/programs-study/ecology-evolutionary-biology/ecology-evolutionary-biology-bachelor-arts-ba/ ; needs a human check against the official page before the demo.
# 2026-2027 University Catalog. CU Boulder has no single "Biology" major. This file uses Ecology and
# Evolutionary Biology (EBIO) B.A. as the stand-in: its intro sequence is General Biology 1 and 2
# (EBIO 1210-1240) and it spans ecology, genetics and evolution with flexible ancillary science.
# Molecular, Cellular and Developmental Biology (MCDB) B.A. is the narrower molecular alternative.
# The page was read through a summarising fetch, not copied verbatim. Its lab/field and 4000-level
# lists say "possible choices include", so they may not be complete.
id: ebio-ba
name: Ecology and Evolutionary Biology B.A.
type: major
catalog_year: 2026
source_url: https://catalog.colorado.edu/undergraduate/colleges-schools/arts-sciences/programs-study/ecology-evolutionary-biology/ecology-evolutionary-biology-bachelor-arts-ba/
checked_on: 2026-10-29
total_credits: 120
complete: false  # major rules only; EBIO elective credits, ancillary science and A&S Gen Ed aren't encoded
rules:
  - id: intro-biology
    title: Introductory biology
    kind: one_of_groups
    groups:
      - [EBIO 1210, EBIO 1230, EBIO 1220, EBIO 1240]
      - [EBIO 1210, EBIO 1230, EBIO 1250]
      - [EBIO 1210, EBIO 1230, EBIO 1100, EBIO 1110]
      - [EBIO 1220, EBIO 1240, EBIO 1250]
      - [EBIO 1220, EBIO 1240, EBIO 1100, EBIO 1110]
      - [EBIO 1250, EBIO 1100, EBIO 1110]
    min_grade: C-
    notes:
      - The catalog says "complete two of" four options (EBIO 1210 & 1230, EBIO 1220 & 1240, EBIO 1250, EBIO 1100 & 1110); each group here is one pair of options.
      - AP Biology 4 or 5 exempts EBIO 1210-1240; CLEP Biology at the 66th percentile or above exempts EBIO 1210 and 1220.
  - id: core
    title: Ecology, genetics and evolution
    kind: all_of
    courses: [EBIO 2040, EBIO 2070, EBIO 3080]
    min_grade: C-
  - id: lab-field
    title: Lab or field course
    kind: n_of
    n: 1
    courses: [EBIO 3170, EBIO 3240, EBIO 3400, EBIO 3630, EBIO 3850, EBIO 4100, EBIO 4500, EBIO 4510, EBIO 4520, EBIO 4660, EBIO 4750, EBIO 4760]
    min_grade: C-
    notes:
      - Any EBIO lab or field course at the 3000 level or above; the catalog lists these as possible choices.
  - id: upper-4000
    title: EBIO 4000-level courses
    kind: level
    subjects: [EBIO]
    min_level: 4000
    n: 2
    min_grade: C-
    notes:
      - The catalog asks for at least 6 credits at the 4000 level or above, e.g. EBIO 4030, 4060, 4100, 4140, 4160, 4175, 4290, 4410, 4740, 4800, 4840, 4870.
      - Must include one course taken on the Boulder campus, at the Mountain Research Station or on a CU Boulder Global Seminar; at most 3 of these credits may be independent study or research.
  - id: statistics
    title: Statistics
    kind: n_of
    n: 1
    courses: [EBIO 1010, IPHY 3280, MATH 2510, MATH 3510, PSYC 2111, EBIO 4410]
    min_grade: C-
    notes:
      - Only EBIO 4410 counts toward the 38 EBIO major credits.
notes:
  - 38 credits of EBIO coursework, including 8-9 credits of EBIO electives to reach 38.
  - "Ancillary math and science: select three courses (9-15 credits) from the catalog lists under Mathematics, Chemistry, Physics, Earth Science, Geography, Geography GIS, Atmospheric and Oceanic Sciences and Computer Science. For CHEM 1113 and 1114 the lecture and lab must both be taken."
  - Required major and ancillary courses need C- or better and cannot be taken pass/fail.
  - Major GPA of at least 2.000 to graduate.
  - Up to 12 credits from other departments (list from the EBIO advisor), up to 6 of independent study or research and up to 6 of internship may count toward the 38.
  - Transfer students must complete at least 12 upper-division EBIO credits on the Boulder campus.
  - "A&S degree requirements (not encoded; from https://catalog.colorado.edu/undergraduate/colleges-schools/arts-sciences/policies-requirements/): 120 credits, 45 upper-division, 45 at CU Boulder with 30 upper-division A&S, 2.00 GPA overall and in the major, and Gen Ed (World Language, Quantitative Reasoning, Written Communication, 12 credits each of Arts & Humanities, Natural Sciences with a lab and Social Sciences, U.S. and Global Perspective)."
