# CU Boulder school pack. Inherits everything from the CU config and only
# states the school identity.
base: ../../undergrad_config.yaml

school:
  slug: cu-boulder
  timezone: America/Denver
  status: active

app:
  short_name: "CU Boulder"
  # School colours (DESIGN.md): every role for light and dark. The frontend writes
  # each as a CSS variable and builds the MUI theme from the same values.
  theme:
    light:
      deep: "#000000"
      deep_raised: "#222222"
      on_deep: "#FFFFFF"
      on_deep_soft: "#FFFFFFA8"
      signal: "#CFB87C"
      signal_hover: "#BDA365"
      on_signal: "#000000"
      tint: "#F4EEDD"
      tint_strong: "#E7DAB5"
      tint_ink: "#594819"
      band: "#000000"
      mark_bg: "#CFB87C"
      mark_ink: "#000000"
      canvas: "#F5F4F0"
      line_1: "#2F5BEA"
      line_2: "#A07A1E"
      line_3: "#565A5C"
    dark:
      deep: "#000000"
      deep_raised: "#1E1E1C"
      on_deep: "#FFFFFF"
      on_deep_soft: "#FFFFFF9E"
      signal: "#CFB87C"
      signal_hover: "#DCC995"
      on_signal: "#000000"
      tint: "#2B2617"
      tint_strong: "#4A4022"
      tint_ink: "#EADCB2"
      band: "#000000"
      mark_bg: "#CFB87C"
      mark_ink: "#000000"
      canvas: "#0E0E0C"
      line_1: "#7EA1FF"
      line_2: "#CFB87C"
      line_3: "#A2A4A3"

# Data stores (mongodb.database_name, rag.chroma_collection) come from the base
# config and keep their existing names, so current users' chats and documents stay.

planner:
  # Terms CU Class Search (FOSE) publishes sections for.
  terms: ["Fall 2026", "Spring 2027"]
  # First and last day of classes ("Classes Begin", "Last Day of Classes"),
  # Main Campus, from the registrar's calendar PDFs linked on
  # https://www.colorado.edu/registrar/students/calendar (checked 2026-10-29):
  # Fall 2026 https://www.colorado.edu/registrar/media/1942
  # Spring 2027 https://www.colorado.edu/registrar/media/1943
  term_dates:
    "Fall 2026": {first_day: 2026-08-20, last_day: 2026-12-04}
    "Spring 2027": {first_day: 2027-01-07, last_day: 2027-04-23}

campus:
  # OpenStreetMap campus area for scripts/import_places.py (Main Campus (tagged boundary=administrative in OSM)).
  osm_area:
    type: way
    id: 46226108
  places_file: places.geojson
  # Events and the Campus map start from here until a student picks their own
  # start (a place name or id); the map opens on this category.
  default_origin: "University Memorial Center"
  default_category: dining

student_life:
  # Public iCal feed (see schools/FEEDS.md). The school timezone above is used
  # for every event, whatever the feed's own header says.
  event_feeds:
    - url: "https://calendar.colorado.edu/calendar.ics"
      name: "CU Boulder Events Calendar"

tools:
  find_place:
    enabled: true
  events_search:
    enabled: true
    max_results: 15
  # Semester planner (chat proposes only; the student accepts on the card).
  plan_edit:
    enabled: true
  plan_suggest:
    enabled: true

# Chat composer prompt, in the same words as the home page.
chat_page:
  placeholder: "Ask about courses, events or places"

# Home page sample questions, grouped by domain. Keep them answerable by
# this school's enabled tools and places data.
homepage:
  starters:
    - domain: academics
      title: "Academics"
      prompts:
        - "What sections of CSCI 2270 are offered?"
        - "How do students rate CSCI professors?"
    - domain: student_life
      title: "Student life"
      prompts:
        - "What's happening on campus tonight?"
        - "Any career workshops this week?"
    - domain: campus
      title: "Getting around"
      prompts:
        - "Where is the UMC?"
        - "How far is Norlin Library from the UMC?"
