# CU Boulder school pack. Inherits everything from the CU config and only
# states the school identity.
base: ../../undergrad_config.yaml

school:
  slug: cu-boulder
  timezone: America/Denver
  status: active

# Data stores (mongodb.database_name, rag.chroma_collection) come from the base
# config and keep their existing names, so current users' chats and documents stay.

campus:
  # OpenStreetMap campus area for scripts/import_places.py (Main Campus (tagged boundary=administrative in OSM)).
  osm_area:
    type: way
    id: 46226108
  places_file: places.geojson
  # Events and the Campus map start from here until a student picks their own
  # start (a place name or id); the map opens on this category.
  default_origin: "University Memorial Center"
  default_category: dining

student_life:
  # Public iCal feed (see schools/FEEDS.md). The school timezone above is used
  # for every event, whatever the feed's own header says.
  event_feeds:
    - url: "https://calendar.colorado.edu/calendar.ics"
      name: "CU Boulder Events Calendar"

tools:
  find_place:
    enabled: true
  events_search:
    enabled: true
    max_results: 15
  # Semester planner (chat proposes only; the student accepts on the card).
  plan_edit:
    enabled: true
  plan_suggest:
    enabled: true

# Chat composer prompt, in the same words as the home page.
chat_page:
  placeholder: "Ask about courses, events or places"

# Home page sample questions, grouped by domain. Keep them answerable by
# this school's enabled tools and places data.
homepage:
  starters:
    - domain: academics
      title: "Academics"
      prompts:
        - "What sections of CSCI 2270 are offered?"
        - "How do students rate CSCI professors?"
    - domain: student_life
      title: "Student life"
      prompts:
        - "What's happening on campus tonight?"
        - "Any career workshops this week?"
    - domain: campus
      title: "Getting around"
      prompts:
        - "Where is the UMC?"
        - "How far is Norlin Library from the UMC?"
