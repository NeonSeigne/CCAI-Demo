# University of Virginia school pack. Reuses the undergrad advisor personas and
# layout; branding and tools are UVA's own.
base: ../../undergrad_config.yaml

school:
  slug: uva
  timezone: America/New_York
  status: active

app:
  title: "UVA Undergraduate Advisor"
  institution: "University of Virginia"
  short_name: "UVA"
  footer_text: "Unofficial student advising demo for the University of Virginia."
  # School colours (DESIGN.md): every role for light and dark. The frontend writes
  # each as a CSS variable and builds the MUI theme from the same values.
  # Student life moves to UVA yellow so it doesn't collide with UVA orange.
  theme:
    light:
      deep: "#232D4B"
      deep_raised: "#303B5E"
      on_deep: "#FFFFFF"
      on_deep_soft: "#FFFFFFB3"
      signal: "#E57200"
      signal_hover: "#C96400"
      on_signal: "#14171F"
      tint: "#FCEBDD"
      tint_strong: "#F8D2AE"
      tint_ink: "#8A4206"
      band: "#232D4B"
      mark_bg: "#E57200"
      mark_ink: "#14171F"
      canvas: "#F3F4F7"
      line_1: "#009FDF"
      line_2: "#EF3F6B"
      line_3: "#62BB46"
      life: "#C79A00"
    dark:
      deep: "#1B2440"
      deep_raised: "#27325A"
      on_deep: "#FFFFFF"
      on_deep_soft: "#FFFFFFA8"
      signal: "#F28A2E"
      signal_hover: "#FF9D47"
      on_signal: "#14171F"
      tint: "#33230F"
      tint_strong: "#5A3712"
      tint_ink: "#FFD3A8"
      band: "#232D4B"
      mark_bg: "#F28A2E"
      mark_ink: "#14171F"
      canvas: "#10131B"
      line_1: "#3DB8EA"
      line_2: "#F46A8D"
      line_3: "#7FCB66"
      life: "#E9C13A"


mongodb:
  database_name: uva_advisor

rag:
  chroma_collection: uva_docs

academics:
  # Public CSV exports from theCourseForum (github.com/thecourseforum/theCourseForum2).
  # This is snapshot data, not live: answers say how old it is, and seat counts
  # are described as historical. HoosList and SIS are not usable (bot challenge /
  # login required).
  provider: csv_snapshot
  snapshot:
    source_name: "theCourseForum"
    source_url: "https://thecourseforum.com"
    sections_url: "https://raw.githubusercontent.com/thecourseforum/theCourseForum2/HEAD/tcf_website/management/commands/semester_data/csv/2026_fall.csv"
    # Every term the planner covers. The chat tools read sections_url above.
    sections_by_term:
      "Fall 2026": "https://raw.githubusercontent.com/thecourseforum/theCourseForum2/HEAD/tcf_website/management/commands/semester_data/csv/2026_fall.csv"
      "Spring 2027": "https://raw.githubusercontent.com/thecourseforum/theCourseForum2/HEAD/tcf_website/management/commands/semester_data/csv/2027_spring.csv"
    grades_urls:
      - "https://raw.githubusercontent.com/thecourseforum/theCourseForum2/HEAD/tcf_website/management/commands/grade_data/csv/2026_spring.csv"
      - "https://raw.githubusercontent.com/thecourseforum/theCourseForum2/HEAD/tcf_website/management/commands/grade_data/csv/2025_fall.csv"
      - "https://raw.githubusercontent.com/thecourseforum/theCourseForum2/HEAD/tcf_website/management/commands/grade_data/csv/2025_spring.csv"
      - "https://raw.githubusercontent.com/thecourseforum/theCourseForum2/HEAD/tcf_website/management/commands/grade_data/csv/2024_fall.csv"
      - "https://raw.githubusercontent.com/thecourseforum/theCourseForum2/HEAD/tcf_website/management/commands/grade_data/csv/2024_spring.csv"
    refresh_hours: 24

planner:
  # College of Arts & Sciences course load: 12 credits minimum, 18 maximum
  # without the advising dean's permission (other UVA schools may differ).
  # "Harder" uses the hardest third of the snapshot's grade data.
  credit_limits: {min: 12, max: 18}
  credit_limits_source: "https://college.as.virginia.edu/course_load"
  # First and last day of classes (Academic Division). Fall 2026's first day
  # is from https://as.virginia.edu/fall-semester-2026 ("Fall courses begin
  # Tuesday, Aug. 25", checked 2026-10-29). The registrar's calendar
  # (https://registrar.virginia.edu/calendar/academic/2026-2027) refuses
  # automated requests, so the other dates aren't verified and are left out;
  # "Your classes today" stays hidden until both dates of a term are here.
  term_dates:
    "Fall 2026": {first_day: 2026-08-25}

campus:
  # OpenStreetMap campus area for scripts/import_places.py (amenity=university).
  osm_area:
    type: relation
    id: 4218705
  places_file: places.geojson
  # Events and the Campus map start from here until a student picks their own
  # start (a place name or id); the map opens on this category.
  default_origin: "Shannon Library"
  default_category: library

student_life:
  # Public iCal feed (see schools/FEEDS.md). The school timezone above is used
  # for every event, whatever the feed's own header says.
  event_feeds:
    - url: "https://www.trumba.com/calendars/university-of-virginia-events.ics"
      name: "UVA Events Calendar"
  # Event kind from the feed's Trumba "Event Type" values, then its calendar
  # categories. Values left out (Admissions, Special Event, Meeting,
  # Workshop, Webinar, Information Session, unit calendars) give no kind.
  event_kinds:
    "Athletics": athletics
    "Performance": arts
    "Exhibit": arts
    "Screening": arts
    "Arts": arts
    "Music Department": arts
    "Drama Department": arts
    "Fralin": arts
    "kluge-ruhe": arts
    "Academic": academic
    "Lectures & Seminars": academic
    "Conference": academic
    "Student Activity": campus_life
    "Student Life": campus_life

tools:
  find_place:
    enabled: true
  events_search:
    enabled: true
    max_results: 15
  # CU's FOSE course search does not serve UVA.
  search_courses:
    enabled: false
  course_search:
    enabled: true
    max_results: 20
  course_grades:
    enabled: true
  course_sections:
    enabled: true
    max_results: 25
  rate_my_professor:
    enabled: true
    # From scripts/rmp_school_lookup.py "University of Virginia".
    school_id: "U2Nob29sLTEyNzc="
  # Semester planner (chat proposes only; the student accepts on the card).
  plan_edit:
    enabled: true
  plan_suggest:
    enabled: true

# Chat composer prompt, in the same words as the home page.
chat_page:
  placeholder: "Ask about courses, events or places"

# Home page sample questions, grouped by domain. Keep them answerable by
# this school's enabled tools and places data.
homepage:
  features_title: "Why Use UVA Undergraduate Advisor?"
  starters:
    - domain: academics
      title: "Academics"
      prompts:
        - "What's the grade spread in CS 2100?"
        - "Which CS 2100 sections were open?"
    - domain: student_life
      title: "Student life"
      prompts:
        - "Anything calm to do tonight?"
        - "Wellness events this week"
    - domain: campus
      title: "Getting around"
      prompts:
        - "Where is Newcomb Hall?"
        - "How far is the Rotunda from Alderman Library?"
