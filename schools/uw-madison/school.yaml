# UW-Madison school pack.
base: ../../wisconsin_config.yaml

school:
  slug: uw-madison
  timezone: America/Chicago
  status: active

app:
  short_name: "UW–Madison"
  # School colours (DESIGN.md): every role for light and dark. The frontend writes
  # each as a CSS variable and builds the MUI theme from the same values.
  # Toned-down red on large areas; Badger red only on small things. "Harder" is ink plus an icon so red stays the school's.
  theme:
    light:
      deep: "#7D1015"
      deep_raised: "#8F2227"
      on_deep: "#FFFFFF"
      on_deep_soft: "#FFFFFFBD"
      signal: "#C5050C"
      signal_hover: "#9B0000"
      on_signal: "#FFFFFF"
      tint: "#F9ECEC"
      tint_strong: "#F0CFD0"
      tint_ink: "#8A1015"
      band: "#14171F"
      mark_bg: "#FFFFFF"
      mark_ink: "#C5050C"
      canvas: "#F6F5F4"
      line_1: "#2F5BEA"
      line_2: "#9B0000"
      line_3: "#1E9E5A"
      harder: "#14171F"
    dark:
      deep: "#3B1A1C"
      deep_raised: "#4C2427"
      on_deep: "#FFFFFF"
      on_deep_soft: "#FFFFFFB8"
      signal: "#D0343A"
      signal_hover: "#DD4A50"
      on_signal: "#FFFFFF"
      tint: "#2E1A1B"
      tint_strong: "#4A2427"
      tint_ink: "#FFC9CB"
      band: "#2A1A1B"
      mark_bg: "#FFFFFF"
      mark_ink: "#C5050C"
      canvas: "#121010"
      line_1: "#7EA1FF"
      line_2: "#FF6B70"
      line_3: "#5CC98A"
      harder: "#EEF0F4"

# Data stores (mongodb.database_name, rag.chroma_collection) come from the base
# config and keep their existing names, so current users' chats and documents stay.

planner:
  # Registrar: undergraduates are full time at 12-18 credits in fall and
  # spring; more than 18 needs the academic dean's approval.
  credit_limits: {min: 12, max: 18}
  credit_limits_source: "https://registrar.wisc.edu/credit-load-and-ranges/"
  # About the hardest third of undergraduate courses by Course Map average
  # GPA (sample of ~850 courses numbered below 500, October 2026).
  harder_below_gpa: 3.4
  # Terms Course Map lists offerings for.
  terms: ["Fall 2026", "Spring 2027"]
  # First and last day of classes ("Fall/Spring semester instruction begins",
  # "Last class day"), from https://secfac.wisc.edu/academic-calendar/
  # (Faculty Senate academic calendar, checked 2026-10-29).
  term_dates:
    "Fall 2026": {first_day: 2026-09-02, last_day: 2026-12-09}
    "Spring 2027": {first_day: 2027-01-19, last_day: 2027-04-30}

campus:
  # OpenStreetMap campus area for scripts/import_places.py (amenity=university).
  osm_area:
    type: relation
    id: 7144092
  places_file: places.geojson
  # Events and the Campus map start from here until a student picks their own
  # start (a place name or id); the map opens on this category.
  default_origin: "College Library"
  default_category: library

student_life:
  # Public iCal feed (see schools/FEEDS.md). The school timezone above is used
  # for every event, whatever the feed's own header says.
  event_feeds:
    # The feed stops after `limit` events (about 4 days at 200), so it is read
    # as two pages (page=1..2), about 9 days.
    - url: "https://today.wisc.edu/events.ics?limit=200"
      name: "UW–Madison Today"
      pages: 2
  # No event_kinds: the feed carries no category, host or cost fields, so
  # those stay null.

tools:
  find_place:
    enabled: true
  events_search:
    enabled: true
    max_results: 15
  # Semester planner (chat proposes only; the student accepts on the card).
  plan_edit:
    enabled: true
  plan_suggest:
    enabled: true

# Chat composer prompt, in the same words as the home page.
chat_page:
  placeholder: "Ask about courses, events or places"

# Home page sample questions, grouped by domain. Keep them answerable by
# this school's enabled tools and places data.
homepage:
  starters:
    - domain: academics
      title: "Academics"
      prompts:
        - "How hard is COMP SCI 300?"
        - "What can I take after COMP SCI 300?"
    - domain: student_life
      title: "Student life"
      prompts:
        - "What's on at Union South today?"
        - "Any study abroad events this week?"
    - domain: campus
      title: "Getting around"
      prompts:
        - "Where is Grainger Hall?"
        - "How far is Union South from College Library?"
