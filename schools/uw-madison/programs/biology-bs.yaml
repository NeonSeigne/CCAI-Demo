# Drafted from https://guide.wisc.edu/undergraduate/letters-science/integrative-biology/biology-bs/ ; needs a human check against the official page before the demo.
# Guide 2026-2027, Biology major in the College of Letters & Science (not the CALS Biology B.S., which has its own
# page and college rules), standard major paired with the L&S B.S. The major requirements are the same with the
# B.A. (the page says the major pairs with either degree). The Evolutionary Biology named option is not covered.
# Cross-listed courses are listed under their BIOLOGY number when they have one (e.g. BIOLOGY/BOTANY/ZOOLOGY 151 as
# BIOLOGY 151), otherwise under the first subject the Guide lists (e.g. BIOCHEM/NUTR SCI 510 as BIOCHEM 510).
# PATH-BIO 307 (category D) is left out of the rules because the program format doesn't accept hyphenated subjects.
