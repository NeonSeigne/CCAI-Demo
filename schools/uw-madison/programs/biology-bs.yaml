notes:
  - Minimum 31 credits of Biological Science courses within Introductory biology, the Foundation course, Upper-level breadth and Additional Lab or Field Research.
  - Unless stated otherwise, a course may not be used to meet more than one requirement of the major.
  - "Additional Lab or Field Research (not encoded), one of: one more approved lab course plus at least 2 credits from categories A-E; at least 2 credits of approved directed study in a biological science (after completing Introductory biology); or an approved two-semester thesis in biological science."
  - Minimum 2.000 GPA in all BIOLOGY and major courses.
  - Minimum 2.000 GPA on at least 15 credits of upper-level major work in residence; the Foundation course and Upper-level breadth count as upper level.
  - At least 15 credits in the major taken on the UW-Madison campus.
  - Students may complete only one Biology major or named option.
  - Biology may not be combined in a double major with the Molecular and Cell Biology major or the Neurobiology major.
  - "Honors in the major (not encoded): 3.300 University GPA and 3.300 GPA in the major, 13 credits of Foundation and Upper-level breadth taken for Honors, B or better in every Honors course, and an approved two-semester Senior Honors Thesis (6 credits)."
  - "L&S B.S. degree requirements (not encoded): 120 credits, 108 in Liberal Arts and Science coursework, 60 at the Intermediate or Advanced level, 30 credits in residence and 30 in residence after the 86th credit, 2.000 GPA overall and in Intermediate/Advanced coursework, Communication A and B, Quantitative Reasoning A and B, one Ethnic Studies course, the third unit of a language other than English, two Intermediate/Advanced MATH, COMP SCI or STAT courses of 3+ credits (at most one each in COMP SCI and STAT), and breadth (12 Humanities including 6 Literature, 12 Social Science, 12 Natural Science including 6 Biological and 6 Physical Science)."
  - "University Core GenEd requirements (not encoded) apply to students starting Summer 2026 or later: 30 credits across Civics & Perspectives, Communication & Literacy, Humanities & Arts, Mathematics & Quantitative Reasoning, Natural Science & Wellness, and Social & Behavioral Science."
