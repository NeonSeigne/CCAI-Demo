# Drafted from https://guide.wisc.edu/undergraduate/letters-science/mathematics/mathematics-bs/ ; needs a human check against the official page before the demo.
# Guide 2026-2027, standard Mathematics major paired with the L&S B.S. The major requirements are the same with the
# B.A. (the page says the major pairs with either degree). The six named options are separate and not covered here.
# Cross-listed courses are listed under their MATH number (e.g. MATH/COMP SCI 513 as MATH 513), except courses
# cross-listed with STAT, which are listed under both subjects (as in econ-ba.yaml).
id: math-bs
name: Mathematics B.S.
type: major
catalog_year: 2026
source_url: https://guide.wisc.edu/undergraduate/letters-science/mathematics/mathematics-bs/
checked_on: 2026-10-29
total_credits: 120
complete: false  # major rules only; L&S breadth, language, residency and Core GenEd aren't encoded
rules:
  - id: linear-algebra
    title: Linear algebra
    line: Core
    kind: n_of
    n: 1
    courses: [MATH 341, MATH 320, MATH 340, MATH 345, MATH 375]
    notes:
      - Only one linear algebra course counts toward the seven-course and 21-credit minimums.
  - id: transition
    title: Transition to advanced mathematics
    line: Core
    kind: one_of_groups
    double_count: true
    groups:
      - [MATH 341]
      - [MATH 375]
      - [MATH 421]
      - [MATH 467]
      - [MATH 321, MATH 322]
    notes:
      - MATH 341 or MATH 375 used for Linear algebra may also count here; it counts once toward the course and credit minimums.
  - id: analysis-algebra-topology
    title: Analysis, topology and algebra
    line: Core
    kind: n_of
    n: 2
    courses: [MATH 521, MATH 541, MATH 551]
  - id: advanced-elective
    title: Advanced MATH elective
    line: Electives
    kind: n_of
    n: 1
    courses: [
      MATH 513, MATH 514, MATH 519, MATH 521, MATH 522, MATH 525, STAT 525, MATH 531,
      MATH 535, MATH 540, MATH 541, MATH 542, MATH 551, MATH 552, MATH 561, MATH 567,
      MATH 570, MATH 571, MATH 607, MATH 609, MATH 616, MATH 619, MATH 621, MATH 623,
      MATH 627, MATH 629, MATH 632, STAT 632, MATH 635, MATH 681, MATH 682, MATH 691,
      MATH 692, MATH 698, MATH 699,
    ]
    notes:
      - Must be at least 3 credits and distinct from the courses used above.
  - id: major-courses
    title: Seven MATH courses
    line: Electives
    kind: n_of
    n: 7
    double_count: true
    courses: [
      # Linear algebra and transition courses
      MATH 341, MATH 320, MATH 340, MATH 345, MATH 375, MATH 421, MATH 467, MATH 321, MATH 322,
      # Advanced MATH electives
      MATH 513, MATH 514, MATH 519, MATH 521, MATH 522, MATH 525, STAT 525, MATH 531,
      MATH 535, MATH 540, MATH 541, MATH 542, MATH 551, MATH 552, MATH 561, MATH 567,
      MATH 570, MATH 571, MATH 607, MATH 609, MATH 616, MATH 619, MATH 621, MATH 623,
      MATH 627, MATH 629, MATH 632, STAT 632, MATH 635, MATH 681, MATH 682, MATH 691,
      MATH 692, MATH 698, MATH 699,
      # Additional MATH electives
      MATH 431, STAT 431, MATH 309, STAT 309, MATH 310, STAT 310, MATH 319, MATH 376,
      MATH 390, MATH 407, MATH 415, MATH 425, MATH 435, MATH 443, MATH 444, MATH 461,
      MATH 473, MATH 475, STAT 475, MATH 490, MATH 491,
    ]
    notes:
      - Counts every course used in the rules above plus MATH electives.
      - At most one introductory probability course (MATH/STAT 309 or MATH/STAT 431) counts.
      - At most one introductory differential equations course (MATH 319, MATH 320 or MATH 376) counts.
      - MATH 390 counts only once.
  - id: major-credits
    title: 21 MATH credits
    line: Electives
    kind: credits_from
    credits: 21
    double_count: true
    courses: [
      MATH 341, MATH 320, MATH 340, MATH 345, MATH 375, MATH 421, MATH 467, MATH 321, MATH 322,
      MATH 513, MATH 514, MATH 519, MATH 521, MATH 522, MATH 525, STAT 525, MATH 531,
      MATH 535, MATH 540, MATH 541, MATH 542, MATH 551, MATH 552, MATH 561, MATH 567,
      MATH 570, MATH 571, MATH 607, MATH 609, MATH 616, MATH 619, MATH 621, MATH 623,
      MATH 627, MATH 629, MATH 632, STAT 632, MATH 635, MATH 681, MATH 682, MATH 691,
      MATH 692, MATH 698, MATH 699,
      MATH 431, STAT 431, MATH 309, STAT 309, MATH 310, STAT 310, MATH 319, MATH 376,
      MATH 390, MATH 407, MATH 415, MATH 425, MATH 435, MATH 443, MATH 444, MATH 461,
      MATH 473, MATH 475, STAT 475, MATH 490, MATH 491,
    ]
notes:
  - The major requires at least seven MATH courses for at least 21 credits.
  - Minimum 2.000 GPA in all MATH and major courses.
  - Minimum 2.000 GPA on 15 upper-level major credits taken in residence; MATH courses numbered 307-699 count as upper level.
  - At least 15 MATH credits taken on the UW-Madison campus.
  - "Honors in the major (not encoded): 3.300 University GPA and 3.300 GPA in MATH and major courses; MATH 521, 522, 541 and 542 taken for Honors with B or better; two more MATH 500-680 courses taken for Honors; and a capstone (MATH 681 and 682, or an approved two-course upper-level sequence)."
  - Honors in the major is not available in any named option.
  - "L&S B.S. degree requirements (not encoded): 120 credits, 108 in Liberal Arts and Science coursework, 60 at the Intermediate or Advanced level, 30 credits in residence and 30 in residence after the 86th credit, 2.000 GPA overall and in Intermediate/Advanced coursework, Communication A and B, Quantitative Reasoning A and B, one Ethnic Studies course, the third unit of a language other than English, two Intermediate/Advanced MATH, COMP SCI or STAT courses of 3+ credits (at most one each in COMP SCI and STAT), and breadth (12 Humanities including 6 Literature, 12 Social Science, 12 Natural Science including 6 Biological and 6 Physical Science)."
  - "University Core GenEd requirements (not encoded) apply to students starting Summer 2026 or later: 30 credits across Civics & Perspectives, Communication & Literacy, Humanities & Arts, Mathematics & Quantitative Reasoning, Natural Science & Wellness, and Social & Behavioral Science."
