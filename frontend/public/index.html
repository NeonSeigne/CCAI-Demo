    <script>
      // Theme before first paint (ThemeContext writes these keys): the stored
      // Auto/Light/Dark choice and the last school's colours for each mode.
      (function () {
        try {
          var mode = localStorage.getItem('cc.theme.v1');
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          var key = dark ? 'dark' : 'light';
          var root = document.documentElement;
          root.dataset.theme = key;
          root.style.colorScheme = key;
          var vars = JSON.parse(localStorage.getItem('cc.theme.vars.v1') || 'null');
          if (vars && vars[key]) {
            for (var name in vars[key]) {
              if (name.indexOf('--') === 0) root.style.setProperty(name, vars[key][name]);
            }
          }
        } catch (e) {}
      })();
    </script>
